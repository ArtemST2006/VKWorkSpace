services:
  ghreport:
    build:
      context: ./service
    image: vkworkspace-ghreport:local
    environment:
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    command:
      - --repos
      - ${GHREPORT_REPOS:-cli/cli}
      - --limit
      - ${GHREPORT_LIMIT:-20}
      - --out
      - "-"
